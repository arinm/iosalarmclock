<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Punctual — App Store search results 3:2</title>
<link rel="stylesheet" href="../reels/lib/base.css"><link rel="stylesheet" href="common.css">
<style>
#head{position:absolute;left:0;top:0;width:1920px}
#head .l{font-size:78px}
</style></head>
<body><div id="stage"><div id="world" class="layer">
  <div id="deco" class="layer"></div>
  <div id="head" class="head"><div class="l">Skip <span class="s">today.</span> Keep <span class="a">tomorrow.</span></div></div>
  <div id="main" class="layer"></div>
</div></div>
<script>window.CLIP={w:1920,h:1280,fps:60,dur:1};</script>
<script src="../reels/lib/engine.js"></script><script src="common.js"></script>
<script>
/* 3840x2560 @2x. Template safe box: centred 2168x1030 px (= 1084x515 CSS px).
   Search is where people decide in a glance: the real card + the promise, both inside it. */
let G={};
function init(){
  G.N=buildNotif($('deco'),{width:560,title:'Alarm in 15 minutes',body:'Wake up · 6:30 AM'});
  G.c2=alarmCard($('deco'),{time:'7:15 AM',label:'Gym',days:[1,3,5],foot:RINGS(),w:560});
  G.c1=alarmCard($('main'),{time:'6:30 AM',label:'Wake up',days:[1,2,3,4,5],foot:SKIPPED(),w:640});
  G.h=$('head').offsetHeight; G.cw=G.c1.offsetWidth; G.ch=G.c1.offsetHeight;
  safeBox(960-542,640-257.5,1084,515);
}
function render(t){
  const top=640-257.5+6, gap=34;
  tf($('head'),`translateY(${top.toFixed(1)}px)`);
  place(G.c1,960-G.cw/2,top+G.h+gap);
  drawNotif(G.N,t,{cx:170,cy:720,drop:1,rot:-7,morph:0,fade:1});
  place(G.c2,1580,470,{rot:6,o:.75});
  envGlow(960,700,.8,1.3); ENV.dust.draw(4);
}
boot({init,render});
</script>
</body></html>
