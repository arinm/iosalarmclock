# XcodeGen spec. Generate the .xcodeproj with:  xcodegen generate
# (brew install xcodegen)  — then open Punctual.xcodeproj in Xcode 26.
name: Punctual
options:
  bundleIdPrefix: com.punctual
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  AlarmCore:
    path: AlarmCore

# Explicit scheme so the local StoreKit config drives the paywall in the
# simulator (products load + sandbox purchases work without App Store Connect).
schemes:
  Punctual:
    build:
      targets:
        Punctual: all
    run:
      config: Debug
      storeKitConfiguration: Punctual.storekit
    test:
      config: Debug
      storeKitConfiguration: Punctual.storekit
      targets:
        - PunctualUITests
    archive:
      config: Release

targets:
  Punctual:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
    dependencies:
      - package: AlarmCore
        product: AlarmCore
      - target: PunctualWidget   # embedded widget extension
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.punctual.app
        CODE_SIGN_ENTITLEMENTS: App/Punctual.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "20"
        DEVELOPMENT_TEAM: KLRCQTV8AC
        CODE_SIGN_STYLE: Automatic
        # iPhone-only (matches the product + iPhone-only App Store screenshots;
        # iPad support would also require iPad screenshots at review).
        TARGETED_DEVICE_FAMILY: "1"
        # App target uses Swift 5 language mode + targeted concurrency: AlarmKit
        # (new in iOS 26) doesn't yet expose Sendability guarantees that satisfy
        # full Swift 6 region isolation. The AlarmCore package stays Swift 6 strict.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: targeted
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Alternate app icons (Pro). Lets setAlternateIconName(_:) use these.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Ocean AppIcon-Forest AppIcon-Grape AppIcon-Sunset AppIcon-Graphite
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Punctual
        # Drive version/build from the build settings above so a bump to
        # CURRENT_PROJECT_VERSION actually reaches the binary (XcodeGen otherwise
        # hardcodes "1" in the generated plist). Xcode expands these at build time.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Required by App Store validation. Portrait-only — an alarm app's
        # hero/list layout is designed vertical.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # AlarmKit authorization prompt copy. NOTE: confirm the exact key name in
        # your installed iOS 26 SDK (NSAlarmKitUsageDescription in betas).
        NSAlarmKitUsageDescription: "Punctual uses alarms that ring through silent mode and Focus so you never oversleep."
        NSCalendarsFullAccessUsageDescription: "Punctual reads your calendar to auto-skip alarms on days with all-day events (holidays, vacation)."
        NSSupportsLiveActivities: true
        # No non-exempt encryption → skips the export-compliance prompt at upload.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch   # BGAppRefreshTask only (no BGProcessingTask → no 'processing')
        BGTaskSchedulerPermittedIdentifiers:
          - com.punctual.app.refresh

  PunctualWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # Privacy manifest (required-reason APIs, no tracking)
      - PunctualWidget/PrivacyInfo.xcprivacy
      # Widget UI + bundle + Live Activity
      - PunctualWidget/NextAlarmWidget.swift
      - PunctualWidget/AlarmLiveActivity.swift
      # AlarmKit-owned Live Activity — required whenever an alarm ships a
      # countdown presentation, or the system may fail to alert.
      - PunctualWidget/AlarmKitLiveActivity.swift
      - PunctualWidget/PunctualWidgetBundle.swift
      # Shared code compiled into both targets (separate modules, no clash)
      - App/Persistence/AlarmItem.swift
      - App/Persistence/AlarmStore.swift
      - App/Scheduling/AlarmScheduler.swift
      - App/Scheduling/CalendarAutoSkip.swift
      - App/AlarmKitIntegration/AlarmKitManager.swift
      - App/Notifications/PreAlertNotificationManager.swift
      - App/Shared/SharedModelContainer.swift
      - App/Shared/SkipTodayIntent.swift
      - App/Shared/PunctualActivityAttributes.swift
      - App/Shared/BrandColor.swift
      - App/Shared/WidgetConfigIntent.swift
    dependencies:
      - package: AlarmCore
        product: AlarmCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.punctual.app.widget
        CODE_SIGN_ENTITLEMENTS: PunctualWidget/PunctualWidget.entitlements
        MARKETING_VERSION: "1.0"      # must match the app
        CURRENT_PROJECT_VERSION: "20"  # must match the app
        TARGETED_DEVICE_FAMILY: "1"   # iPhone-only, matches the app
        DEVELOPMENT_TEAM: KLRCQTV8AC
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: targeted
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PunctualWidget/Info.plist
    info:
      path: PunctualWidget/Info.plist
      properties:
        CFBundleDisplayName: Punctual
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  PunctualUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - PunctualUITests
    dependencies:
      - target: Punctual
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.punctual.app.uitests
        DEVELOPMENT_TEAM: KLRCQTV8AC
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Punctual
        GENERATE_INFOPLIST_FILE: "YES"
